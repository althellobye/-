<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>₍^˶ ╸𖥦 ╸˵^₎⟆♡</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23fce9f0'/%3E%3Ccircle cx='38' cy='40' r='12' fill='%23e85a6f'/%3E%3Ccircle cx='62' cy='40' r='12' fill='%23e85a6f'/%3E%3Cpath d='M30 55 Q50 75 70 55' stroke='%236a8c5a' stroke-width='6' fill='none' stroke-linecap='round' /%3E%3C/svg%3E">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body {
            background: linear-gradient(145deg, #f0f8ff 0%, #fce9f0 100%);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 480px;
            width: 100%;
            background: rgba(255,248,250,0.9);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 16px;
            box-shadow: 0 12px 40px rgba(130,160,200,0.15);
        }
        .title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 300;
            color: #5a7a8a;
            margin-bottom: 12px;
        }
        /* Token 區 */
        .token-area {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            background: white;
            padding: 8px 12px;
            border-radius: 60px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .token-area input {
            flex: 1;
            min-width: 120px;
            border: none;
            padding: 8px 6px;
            font-size: 0.85rem;
            font-family: monospace;
            outline: none;
            background: transparent;
        }
        .token-area .btn-use {
            background: #8ab3d0;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .token-area .btn-use:active { transform: scale(0.94); }
        .token-status {
            font-size: 0.65rem;
            padding: 4px 10px;
            border-radius: 30px;
            display: inline-block;
            align-self: center;
        }
        .token-status.ok { background: #d4edda; color: #155724; }
        .token-status.no { background: #f8d7da; color: #721c24; }

        /* 照片橫條 */
        .photo-strip {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 8px 4px;
            margin-bottom: 12px;
            background: #f5f9fe;
            border-radius: 20px;
            min-height: 70px;
            align-items: center;
            flex-wrap: nowrap;
        }
        .photo-strip .empty {
            color: #aab8c8;
            font-size: 0.8rem;
            padding: 0 12px;
            width: 100%;
            text-align: center;
        }
        .photo-strip .photo-item {
            position: relative;
            flex: 0 0 60px;
            height: 60px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #dcebf5;
        }
        .photo-strip .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-strip .photo-item .del-photo {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #d48a8a;
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            cursor: pointer;
            line-height: 18px;
            text-align: center;
        }
        .photo-strip .upload-btn-sm {
            flex: 0 0 60px;
            height: 60px;
            border-radius: 12px;
            border: 2px dashed #c8dce8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            cursor: pointer;
            background: white;
            color: #8ab3d0;
        }
        .photo-strip .upload-btn-sm input {
            display: none;
        }

        /* 主選單 */
        .main-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
        }
        .main-tabs button {
            flex: 1;
            padding: 10px 0;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            background: #eef4f9;
            color: #4a6a7a;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
        }
        .main-tabs button.active {
            background: #8ab3d0;
            color: white;
            box-shadow: 0 4px 12px #8ab3d066;
        }
        .main-tabs button:active { transform: scale(0.94); }

        /* 內容區 */
        .panel {
            background: #fafdff;
            border-radius: 24px;
            padding: 14px;
            min-height: 400px;
            border: 1px solid #e8f0f8;
        }

        /* 子選單 */
        .sub-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .sub-tabs button {
            padding: 5px 14px;
            border: none;
            border-radius: 40px;
            font-size: 0.8rem;
            background: #eef4f9;
            color: #4a6a7a;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .sub-tabs button.active {
            background: #8ab3d0;
            color: white;
        }

        .btn {
            padding: 6px 18px;
            border: none;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.1s;
            color: white;
            background: #8ab3d0;
            box-shadow: 0 2px 8px #8ab3d066;
        }
        .btn:active { transform: scale(0.94); }
        .btn-danger { background: #d48a8a; box-shadow: 0 2px 8px #d48a8a66; }
        .btn-success { background: #6fbf8a; box-shadow: 0 2px 8px #6fbf8a66; }
        .btn-sm { padding: 3px 12px; font-size: 0.7rem; }

        .flex-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0; }
        .record-card {
            background: white;
            border-radius: 16px;
            padding: 8px 12px;
            margin: 4px 0;
            box-shadow: 0 1px 6px #d0e0ec;
            font-size: 0.85rem;
        }
        .record-card .right { float: right; }
        input, select, textarea {
            background: white;
            border: 1px solid #dce8f0;
            border-radius: 30px;
            padding: 8px 14px;
            font-size: 0.85rem;
            width: 100%;
            outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: #8ab3d0; }
        textarea { border-radius: 16px; min-height: 50px; resize: vertical; }

        /* 日曆 */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7,1fr);
            gap: 3px;
            margin: 6px 0;
        }
        .cal-grid .wk { font-weight: 600; color: #5a7a8a; font-size: 0.7rem; text-align: center; padding: 4px 0; }
        .cal-grid .day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 0.8rem;
            background: #f4f8fc;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .cal-grid .day.has { background: #8ab3d0; color: white; font-weight: 600; }
        .cal-grid .day.other { color: #b0c0d0; }
        .cal-grid .day:active { transform: scale(0.9); }

        /* 成績 */
        .grade-layout {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .grade-semesters {
            flex: 0 0 100px;
            max-height: 200px;
            overflow-y: auto;
        }
        .grade-semesters button {
            display: block;
            width: 100%;
            padding: 4px 8px;
            border: none;
            background: transparent;
            text-align: left;
            font-size: 0.7rem;
            cursor: pointer;
            border-radius: 12px;
            color: #4a6a7a;
        }
        .grade-semesters button.active { background: #8ab3d0; color: white; }
        .grade-subjects {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin: 4px 0;
        }
        .grade-subjects button {
            padding: 2px 12px;
            border: 1px solid #dce8f0;
            border-radius: 30px;
            background: white;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .grade-subjects button.active { background: #8ab3d0; color: white; border-color: #8ab3d0; }
        .grade-records { max-height: 150px; overflow-y: auto; margin-top: 6px; }

        /* 喝水 */
        .cups {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 8px 0;
        }
        .cup {
            width: 36px; height: 46px;
            background: #dce8f0;
            border-radius: 4px 4px 14px 14px;
            border: 2px solid #8ab3d0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            user-select: none;
        }
        .cup.filled { background: #6d9bbb; color: white; border-color: #4f7f9a; }

        /* 日記照片 */
        .diary-photo { max-width: 100%; border-radius: 12px; margin: 4px 0; max-height: 200px; }

        /* 彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal {
            background: white;
            border-radius: 28px;
            padding: 24px 20px;
            max-width: 400px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .modal h3 { margin-bottom: 12px; color: #4a6a7a; }
        .modal .field { margin: 6px 0; }
        .modal .field label { font-size: 0.8rem; color: #6a8a9a; display: block; margin-bottom: 2px; }
        .modal .btn-row { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
        .hidden { display: none !important; }

        .mt-4 { margin-top: 4px; }
        .mb-4 { margin-bottom: 4px; }
        .text-muted { color: #8a9aaa; font-size: 0.8rem; }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="title">₍^˶ ╸𖥦 ╸˵^₎⟆♡</div>

    <!-- Token -->
    <div class="token-area">
        <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx" value="">
        <button class="btn-use" id="useTokenBtn">🔑 使用</button>
        <span class="token-status no" id="tokenStatus">未設定</span>
    </div>

    <!-- 照片橫條 -->
    <div class="photo-strip" id="photoStrip">
        <div class="empty">📸 上傳照片顯示在這裡</div>
    </div>

    <!-- 主選單 -->
    <div class="main-tabs">
        <button class="active" data-tab="study">📚 學習</button>
        <button data-tab="diary">📖 日記</button>
        <button data-tab="health">❤️ 健康</button>
    </div>

    <!-- 內容 -->
    <div class="panel" id="panel"></div>
</div>

<script>
(function() {
    // ===== 儲存 =====
    const STORE_KEY = 'cherry_data_v2';
    const TOKEN_KEY = 'cherry_token_v2';

    function encode(s) { return btoa(encodeURIComponent(s)); }
    function decode(s) { try { return decodeURIComponent(atob(s)); } catch(e) { return null; } }

    function save() {
        try { localStorage.setItem(STORE_KEY, encode(JSON.stringify(store))); return true; }
        catch(e) { return false; }
    }
    function load() {
        try {
            const raw = localStorage.getItem(STORE_KEY);
            if (!raw) return null;
            return JSON.parse(decode(raw));
        } catch(e) { return null; }
    }

    function validToken(t) { return /^ghp_[A-Za-z0-9]{36,40}$/.test(t); }

    // ===== 預設資料 =====
    const SUBJECTS = ['宗教','公民','語文','英文','數學','中國歷史','世界歷史','地理','物理','化學','生物','資訊科技','體育','音樂','藝術','其他'];
    // 只顯示進行中的學段（最近4個）
    function getActiveSemesters() {
        const all = [
            '2024/2025 第一段', '2024/2025 第二段',
            '2025/2026 第一段', '2025/2026 第二段',
            '2026/2027 第一段', '2026/2027 第二段',
            '2027/2028 第一段', '2027/2028 第二段',
            '2028/2029 第一段', '2028/2029 第二段',
            '2029/2030 第一段', '2029/2030 第二段',
            '2030/2031 第一段', '2030/2031 第二段'
        ];
        // 只顯示最近4個
        return all.slice(-4);
    }

    let store = {
        token: localStorage.getItem(TOKEN_KEY) || '',
        photos: [],
        study: { calendar: [], todos: [], grades: {} },
        diary: { entries: [] },
        health: { bmi: [], water: { today: { date: '', cups: 0 }, history: [] }, exercise: [] }
    };

    // 初始化學段
    const activeSems = getActiveSemesters();
    activeSems.forEach(s => { if (!store.study.grades[s]) store.study.grades[s] = {}; });

    const saved = load();
    if (saved) {
        store = saved;
        // 確保學段存在
        activeSems.forEach(s => { if (!store.study.grades[s]) store.study.grades[s] = {}; });
    }

    // ===== DOM =====
    const tokenInput = document.getElementById('tokenInput');
    const tokenStatus = document.getElementById('tokenStatus');
    const photoStrip = document.getElementById('photoStrip');
    const panel = document.getElementById('panel');

    tokenInput.value = store.token || '';

    // ===== Token =====
    document.getElementById('useTokenBtn').addEventListener('click', function() {
        const t = tokenInput.value.trim();
        if (!t) { alert('請輸入 Token'); return; }
        if (!validToken(t)) { alert('Token 格式錯誤，請輸入 ghp_ 開頭的 token'); return; }
        store.token = t;
        localStorage.setItem(TOKEN_KEY, t);
        save();
        updateTokenStatus();
        alert('✅ Token 已設定！');
    });

    function updateTokenStatus() {
        const t = tokenInput.value.trim();
        if (!t) { tokenStatus.textContent = '未設定'; tokenStatus.className = 'token-status no'; }
        else if (validToken(t)) { tokenStatus.textContent = '✅ 有效'; tokenStatus.className = 'token-status ok'; }
        else { tokenStatus.textContent = '⚠️ 格式錯誤'; tokenStatus.className = 'token-status no'; }
    }
    updateTokenStatus();

    // ===== 照片管理 =====
    function renderPhotoStrip() {
        const photos = store.photos || [];
        if (photos.length === 0) {
            photoStrip.innerHTML = `<div class="empty">📸 上傳照片顯示在這裡</div>`;
            return;
        }
        let html = '';
        photos.forEach((p, i) => {
            html += `<div class="photo-item">
                <img src="${p.data}" onclick="window._viewPhoto('${p.data}')">
                <button class="del-photo" onclick="window._delPhoto(${i})">✕</button>
            </div>`;
        });
        html += `<div class="upload-btn-sm" onclick="document.getElementById('photoInput').click()">
            ＋
            <input type="file" id="photoInput" accept="image/*">
        </div>`;
        photoStrip.innerHTML = html;
        document.getElementById('photoInput')?.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                store.photos.push({ id: Date.now(), data: ev.target.result, date: new Date().toISOString().slice(0,10) });
                save();
                renderPhotoStrip();
                renderMain();
            };
            reader.readAsDataURL(file);
            this.value = '';
        });
    }

    window._delPhoto = function(idx) {
        if (!confirm('刪除這張照片嗎？')) return;
        store.photos.splice(idx, 1);
        save();
        renderPhotoStrip();
        renderMain();
    };
    window._viewPhoto = function(data) {
        const w = window.open('', '_blank');
        w.document.write(`<img src="${data}" style="max-width:100%;height:auto;">`);
    };
    renderPhotoStrip();

    // ===== 選單切換 =====
    let currentTab = 'study';
    let currentSub = 'calendar';
    let currentSemester = activeSems[activeSems.length-1] || '2024/2025 第一段';
    let currentSubject = SUBJECTS[0];

    document.querySelectorAll('.main-tabs button').forEach(b => {
        b.addEventListener('click', function() {
            document.querySelectorAll('.main-tabs button').forEach(x => x.classList.remove('active'));
            this.classList.add('active');
            currentTab = this.dataset.tab;
            renderMain();
        });
    });

    function switchSub(sub) { currentSub = sub; renderMain(); }
    function switchSemester(s) { currentSemester = s; renderMain(); }
    function switchSubject(s) { currentSubject = s; renderMain(); }

    // ===== 彈窗系統 =====
    function showModal(title, fields, onSubmit) {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        let html = `<div class="modal"><h3>${title}</h3>`;
        fields.forEach(f => {
            html += `<div class="field">
                <label>${f.label}</label>
                ${f.type === 'textarea' ? `<textarea id="modal_${f.key}" placeholder="${f.placeholder||''}">${f.value||''}</textarea>` :
                  f.type === 'select' ? `<select id="modal_${f.key}">${f.options.map(o => `<option value="${o}" ${o===f.value?'selected':''}>${o}</option>`).join('')}</select>` :
                  f.type === 'date' ? `<input type="date" id="modal_${f.key}" value="${f.value||''}">` :
                  `<input type="${f.type||'text'}" id="modal_${f.key}" placeholder="${f.placeholder||''}" value="${f.value||''}">`}
            </div>`;
        });
        html += `<div class="btn-row">
            <button class="btn btn-danger" onclick="this.closest('.modal-overlay').remove()">取消</button>
            <button class="btn" id="modalSubmit">確認</button>
        </div></div>`;
        overlay.innerHTML = html;
        document.body.appendChild(overlay);

        document.getElementById('modalSubmit').addEventListener('click', function() {
            const result = {};
            fields.forEach(f => {
                const el = document.getElementById(`modal_${f.key}`);
                if (el) result[f.key] = el.value;
            });
            overlay.remove();
            onSubmit(result);
        });
        overlay.addEventListener('click', function(e) { if (e.target === this) this.remove(); });
    }

    // ===== 渲染 =====
    function renderMain() {
        if (currentTab === 'study') panel.innerHTML = renderStudy();
        else if (currentTab === 'diary') panel.innerHTML = renderDiary();
        else if (currentTab === 'health') panel.innerHTML = renderHealth();
        updateTokenStatus();
    }

    // ===== 學習 =====
    function renderStudy() {
        return `
            <div class="sub-tabs">
                <button class="${currentSub==='calendar'?'active':''}" onclick="window._switchSub('calendar')">📅 日曆</button>
                <button class="${currentSub==='todos'?'active':''}" onclick="window._switchSub('todos')">✅ 備忘錄</button>
                <button class="${currentSub==='grades'?'active':''}" onclick="window._switchSub('grades')">📊 成績</button>
            </div>
            ${currentSub === 'calendar' ? renderCalendar() : ''}
            ${currentSub === 'todos' ? renderTodos() : ''}
            ${currentSub === 'grades' ? renderGrades() : ''}
        `;
    }
    window._switchSub = switchSub;

    // ----- 日曆 -----
    function renderCalendar() {
        const now = new Date();
        const y = now.getFullYear(), m = now.getMonth();
        const first = new Date(y,m,1).getDay();
        const days = new Date(y,m+1,0).getDate();
        const today = now.getDate();

        let html = `<div class="flex-row">
            <span style="font-weight:600;">${y}年${m+1}月</span>
            <button class="btn btn-sm" onclick="window._addEvent()">➕ 新增行程</button>
        </div>
        <div class="cal-grid">`;
        ['日','一','二','三','四','五','六'].forEach(d => html += `<div class="wk">${d}</div>`);
        for (let i=0; i<first; i++) html += `<div class="day other"></div>`;
        for (let d=1; d<=days; d++) {
            const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const has = store.study.calendar.some(e => e.date === ds);
            html += `<div class="day ${has?'has':''}" onclick="window._showDay('${ds}')">${d}</div>`;
        }
        html += `</div><div id="dayEvents">`;
        const todayStr = `${y}-${String(m+1).padStart(2,'0')}-${String(today).padStart(2,'0')}`;
        const todayEvents = store.study.calendar.filter(e => e.date === todayStr);
        if (todayEvents.length) {
            html += `<div style="font-weight:600;font-size:0.8rem;margin:4px 0;">📌 今天</div>`;
            todayEvents.forEach(e => {
                html += `<div class="record-card">${e.content} <button class="btn btn-danger btn-sm right" onclick="window._delEvent('${e.date}','${e.content}')">✕</button></div>`;
            });
        } else {
            html += `<div class="text-muted" style="padding:4px 0;">今天沒有行程 ✨</div>`;
        }
        html += `</div>`;
        return html;
    }

    window._addEvent = function() {
        if (!validToken(tokenInput.value.trim())) { alert('請先設定 Token'); return; }
        showModal('新增行程', [
            { key: 'date', label: '日期', type: 'date', value: new Date().toISOString().slice(0,10) },
            { key: 'content', label: '內容', type: 'text', placeholder: '輸入行程內容' }
        ], function(result) {
            if (!result.date || !result.content) { alert('請填寫完整'); return; }
            store.study.calendar.push({ date: result.date, content: result.content });
            save();
            renderMain();
        });
    };

    window._showDay = function(date) {
        const events = store.study.calendar.filter(e => e.date === date);
        if (!events.length) { alert('這天沒有行程'); return; }
        alert(events.map(e => `• ${e.content}`).join('\n'));
    };

    window._delEvent = function(date, content) {
        if (!confirm('刪除這個行程？')) return;
        const idx = store.study.calendar.findIndex(e => e.date === date && e.content === content);
        if (idx > -1) { store.study.calendar.splice(idx,1); save(); renderMain(); }
    };

    // ----- 備忘錄 -----
    function renderTodos() {
        const todos = store.study.todos || [];
        let html = `<button class="btn" onclick="window._addTodo()">➕ 新增待辦</button>`;
        if (!todos.length) html += `<div class="text-muted" style="padding:8px 0;">✨ 沒有待辦事項</div>`;
        todos.forEach((t,i) => {
            html += `<div class="record-card">${t.done?'✅':'⭕'} ${t.text} <button class="btn btn-sm ${t.done?'btn-success':''} right" onclick="window._toggleTodo(${i})">${t.done?'↩️':'✅'}</button></div>`;
        });
        return html;
    }

    window._addTodo = function() {
        if (!validToken(tokenInput.value.trim())) { alert('請先設定 Token'); return; }
        showModal('新增待辦', [
            { key: 'text', label: '待辦事項', type: 'text', placeholder: '輸入事項' }
        ], function(result) {
            if (!result.text) { alert('請輸入內容'); return; }
            store.study.todos.push({ id: Date.now(), text: result.text, done: false });
            save();
            renderMain();
        });
    };

    window._toggleTodo = function(i) {
        store.study.todos[i].done = !store.study.todos[i].done;
        if (store.study.todos[i].done) store.study.todos.splice(i, 1);
        save();
        renderMain();
    };

    // ----- 成績 -----
    function renderGrades() {
        const semesters = Object.keys(store.study.grades).sort().slice(-6);
        const sem = currentSemester;
        const sub = currentSubject;

        let html = `
            <div class="flex-row">
                <button class="btn btn-sm" onclick="window._addSemester()">➕ 新增學段</button>
                <span style="font-size:0.7rem;color:#8a9aaa;">顯示最近6個學段</span>
            </div>
            <div class="grade-layout">
                <div class="grade-semesters">
                    ${semesters.map(s => `<button class="${s===sem?'active':''}" onclick="window._switchSemester('${s}')">${s}</button>`).join('')}
                </div>
                <div style="flex:1;min-width:160px;">
                    <div style="font-weight:600;font-size:0.85rem;">${sem}</div>
                    <div class="grade-subjects">
                        ${SUBJECTS.map(s => `<button class="${s===sub?'active':''}" onclick="window._switchSubject('${s}')">${s}</button>`).join('')}
                    </div>
                    <button class="btn btn-sm" onclick="window._addGrade()">➕ 新增成績</button>
                    <div class="grade-records">
                        ${renderGradeRecords(sem, sub)}
                    </div>
                </div>
            </div>
        `;
        return html;
    }

    function renderGradeRecords(sem, sub) {
        const records = store.study.grades[sem]?.[sub] || [];
        if (!records.length) return `<div class="text-muted" style="padding:4px 0;">📝 尚無成績</div>`;
        let html = '';
        let prev = null;
        records.forEach((r,i) => {
            const encourage = (prev && r.score > prev.score) ? '🎉進步！' : (prev && r.score < prev.score ? '📉加油' : '');
            html += `<div class="record-card">${r.date} ${r.score}分 ${r.note?'('+r.note+')':''} ${encourage} <button class="btn btn-danger btn-sm right" onclick="window._delGrade('${sem}','${sub}',${i})">✕</button></div>`;
            prev = r;
        });
        return html;
    }

    window._switchSemester = function(s) { currentSemester = s; renderMain(); };
    window._switchSubject = function(s) { currentSubject = s; renderMain(); };

    window._addSemester = function() {
        showModal('新增學段', [
            { key: 'name', label: '學段名稱 (例如 2030/2031 第一段)', type: 'text', placeholder: '輸入學段' }
        ], function(result) {
            if (!result.name) { alert('請輸入學段名稱'); return; }
            if (store.study.grades[result.name]) { alert('學段已存在'); return; }
            store.study.grades[result.name] = {};
            currentSemester = result.name;
            save();
            renderMain();
        });
    };

    window._addGrade = function() {
        if (!validToken(tokenInput.value.trim())) { alert('請先設定 Token'); return; }
        const sem = currentSemester;
        const sub = currentSubject;
        showModal('新增成績', [
            { key: 'date', label: '日期', type: 'date', value: new Date().toISOString().slice(0,10) },
            { key: 'score', label: '分數', type: 'number', placeholder: '輸入分數' },
            { key: 'note', label: '補充 (可空白)', type: 'text', placeholder: '備註' }
        ], function(result) {
            if (!result.date || !result.score) { alert('請填寫日期和分數'); return; }
            const score = parseFloat(result.score);
            if (isNaN(score)) { alert('請輸入有效分數'); return; }
            if (!store.study.grades[sem]) store.study.grades[sem] = {};
            if (!store.study.grades[sem][sub]) store.study.grades[sem][sub] = [];
            store.study.grades[sem][sub].push({ date: result.date, score, note: result.note || '' });
            save();
            renderMain();
        });
    };

    window._delGrade = function(sem, sub, idx) {
        if (!confirm('刪除這筆成績？')) return;
        if (store.study.grades[sem]?.[sub]) {
            store.study.grades[sem][sub].splice(idx, 1);
            if (!store.study.grades[sem][sub].length) delete store.study.grades[sem][sub];
            save();
            renderMain();
        }
    };

    // ===== 日記 =====
    function renderDiary() {
        const entries = store.diary.entries || [];
        let html = `
            <button class="btn" onclick="window._addDiary()">➕ 新增日記</button>
            <div class="flex-row">
                <input type="date" id="diarySearch" style="flex:1;">
                <button class="btn btn-sm" onclick="window._searchDiary()">🔍 搜尋</button>
            </div>
            <div style="max-height:300px;overflow-y:auto;">
                ${entries.length === 0 ? '<div class="text-muted" style="padding:8px 0;">📖 還沒有日記</div>' : ''}
                ${entries.slice(-10).reverse().map(e => `
                    <div class="record-card">
                        <div><strong>${e.date||''}</strong> ${e.weather||''} ${e.mood||''}</div>
                        <div>${e.content||''}</div>
                        ${e.image ? `<img src="${e.image}" class="diary-photo">` : ''}
                        <button class="btn btn-sm" onclick="window._editDiary(${e.id})">✏️ 編輯</button>
                    </div>
                `).join('')}
            </div>
        `;
        return html;
    }

    window._addDiary = function() {
        if (!validToken(tokenInput.value.trim())) { alert('請先設定 Token'); return; }
        const pwd = prompt('🔒 密碼 (cherry)');
        if (pwd !== 'cherry') { alert('密碼錯誤'); return; }
        showModal('新增日記', [
            { key: 'date', label: '日期', type: 'date', value: new Date().toISOString().slice(0,10) },
            { key: 'weather', label: '天氣', type: 'select', options: ['晴','陰','雨','雪','多雲'], value: '晴' },
            { key: 'mood', label: '心情', type: 'select', options: ['開心','普通','難過','興奮','平靜'], value: '普通' },
            { key: 'content', label: '內容', type: 'textarea', placeholder: '寫下今天的事...' }
        ], function(result) {
            if (!result.content) { alert('請寫點內容'); return; }
            // 使用最近上傳的照片
            const photos = store.photos || [];
            const lastPhoto = photos.length > 0 ? photos[photos.length-1].data : '';
            store.diary.entries.push({
                id: Date.now(),
                date: result.date || new Date().toISOString().slice(0,10),
                weather: result.weather || '',
                mood: result.mood || '',
                content: result.content,
                image: lastPhoto
            });
            save();
            renderMain();
        });
    };

    window._editDiary = function(id) {
        const entry = store.diary.entries.find(e => e.id === id);
        if (!entry) return;
        const pwd = prompt('🔒 密碼 (cherry)');
        if (pwd !== 'cherry') { alert('密碼錯誤'); return; }
        showModal('編輯日記', [
            { key: 'content', label: '內容', type: 'textarea', value: entry.content }
        ], function(result) {
            if (result.content !== undefined) entry.content = result.content;
            save();
            renderMain();
        });
    };

    window._searchDiary = function() {
        const date = document.getElementById('diarySearch')?.value;
        if (!date) { alert('請選擇日期'); return; }
        const found = store.diary.entries.filter(e => e.date === date);
        if (!found.length) alert('沒有找到當天日記');
        else {
            alert(found.map(e => `${e.date} ${e.weather} ${e.mood}\n${e.content}`).join('\n---\n'));
        }
    };

    // ===== 健康 =====
    function renderHealth() {
        let html = `
            <div class="flex-row">
                <button class="btn btn-sm" onclick="window._showBMI()">🧮 BMI</button>
                <button class="btn btn-sm" onclick="window._showWater()">💧 喝水</button>
                <button class="btn btn-sm" onclick="window._showExercise()">🏃 運動</button>
            </div>
            <div id="healthContent">${renderBMI()}</div>
        `;
        return html;
    }

    function renderBMI() {
        const records = store.health.bmi || [];
        let html = `<button class="btn btn-sm" onclick="window._addBMI()">➕ 記錄 BMI</button>`;
        if (!records.length) html += `<div class="text-muted" style="padding:8px 0;">📊 尚無紀錄</div>`;
        records.forEach((r,i) => {
            let encourage = '';
            if (i>0) {
                const map = {'過度肥胖':0,'輕度肥胖':1,'正常':2,'輕度瘦弱':3,'過度瘦弱':4};
                if ((map[r.status]||0) < (map[records[i-1].status]||0)) encourage = '🌟進步！';
            }
            html += `<div class="record-card">${r.date} ${r.height}cm ${r.weight}kg BMI:${r.bmi} (${r.status}) ${encourage} <button class="btn btn-danger btn-sm right" onclick="window._delBMI(${i})">✕</button></div>`;
        });
        return html;
    }

    window._showBMI = function() { document.getElementById('healthContent').innerHTML = renderBMI(); };
    window._addBMI = function() {
        if (!validToken(tokenInput.value.trim())) { alert('請先設定 Token'); return; }
        const pwd = prompt('🔒 密碼 (cherry)');
        if (pwd !== 'cherry') { alert('密碼錯誤'); return; }
        showModal('記錄 BMI', [
            { key: 'date', label: '日期', type: 'date', value: new Date().toISOString().slice(0,10) },
            { key: 'height', label: '身高 (cm)', type: 'number', placeholder: '輸入身高' },
            { key: 'weight', label: '體重 (kg)', type: 'number', placeholder: '輸入體重' }
        ], function(result) {
            const h = parseFloat(result.height);
            const w = parseFloat(result.weight);
            if (isNaN(h) || isNaN(w)) { alert('請輸入有效數字'); return; }
            const bmi = w / ((h/100)**2);
            let status = '正常';
            if (bmi < 16) status = '過度瘦弱';
            else if (bmi < 18.5) status = '輕度瘦弱';
            else if (bmi >= 24 && bmi < 27) status = '輕度肥胖';
            else if (bmi >= 27) status = '過度肥胖';
            store.health.bmi.push({ date: result.date, height: h, weight: w, bmi: bmi.toFixed(1), status });
            save();
            window._showBMI();
        });
    };
    window._delBMI = function(i) {
        if (!confirm('刪除這筆紀錄？')) return;
        store.health.bmi.splice(i,1);
        save();
        window._showBMI();
    };

    window._showWater = function() {
        const today = new Date().toISOString().slice(0,10);
        const w = store.health.water;
        if (w.today.date !== today) { w.today = { date: today, cups: 0 }; save(); }
        let html = `<div class="cups">`;
        for (let i=0; i<8; i++) {
            html += `<div class="cup ${i<w.today.cups?'filled':''}" onclick="window._addCup(${i})">${i<w.today.cups?'💧':'🥤'}</div>`;
        }
        html += `</div><div>今日已喝 ${w.today.cups} / 8 杯</div>`;
        html += `<div class="flex-row"><button class="btn btn-sm" onclick="window._resetWater()">🔄 重置</button><button class="btn btn-sm" onclick="window._waterHistory()">📋 歷史</button></div>`;
        document.getElementById('healthContent').innerHTML = html;
    };
    window._addCup = function(idx) {
        const w = store.health.water;
        if (idx < w.today.cups) return;
        w.today.cups = Math.min(8, idx+1);
        save();
        window._showWater();
    };
    window._resetWater = function() {
        if (!confirm('重置今日喝水？')) return;
        const w = store.health.water;
        w.history.push({ date: w.today.date, cups: w.today.cups });
        w.today = { date: new Date().toISOString().slice(0,10), cups: 0 };
        save();
        window._showWater();
    };
    window._waterHistory = function() {
        const h = store.health.water.history || [];
        alert('📋 喝水歷史\n' + (h.length ? h.map(x => `${x.date} : ${x.cups}杯`).join('\n') : '尚無歷史'));
    };

    window._showExercise = function() {
        const ex = store.health.exercise || [];
        let html = `<button class="btn btn-sm" onclick="window._addExercise()">➕ 記錄運動</button>`;
        if (!ex.length) html += `<div class="text-muted" style="padding:8px 0;">🏋️ 尚無運動記錄</div>`;
        ex.forEach((e,i) => {
            html += `<div class="record-card">🏃 ${e.date} ${e.type} ${e.duration}分鐘 ${e.note||''} <button class="btn btn-danger btn-sm right" onclick="window._delExercise(${i})">✕</button></div>`;
        });
        document.getElementById('healthContent').innerHTML = html;
    };

    window._addExercise = function() {
        if (!validToken(tokenInput.value.trim())) { alert('請先設定 Token'); return; }
        showModal('記錄運動', [
            { key: 'date', label: '日期', type: 'date', value: new Date().toISOString().slice(0,10) },
            { key: 'type', label: '運動類型', type: 'text', placeholder: '跑步/游泳/跳繩/重訓' },
            { key: 'duration', label: '分鐘數', type: 'number', placeholder: '輸入分鐘' },
            { key: 'note', label: '備註 (可空白)', type: 'text', placeholder: '備註' }
        ], function(result) {
            if (!result.type || !result.duration) { alert('請填寫完整'); return; }
            store.health.exercise.push({ date: result.date, type: result.type, duration: parseInt(result.duration)||0, note: result.note||'' });
            save();
            window._showExercise();
        });
    };
    window._delExercise = function(i) {
        if (!confirm('刪除這筆紀錄？')) return;
        store.health.exercise.splice(i,1);
        save();
        window._showExercise();
    };

    // ===== 初始化 =====
    renderMain();

    // 每日喝水重置檢查
    setInterval(() => {
        const today = new Date().toISOString().slice(0,10);
        if (store.health.water.today.date !== today) {
            store.health.water.history.push({ date: store.health.water.today.date, cups: store.health.water.today.cups });
            store.health.water.today = { date: today, cups: 0 };
            save();
        }
    }, 60000);

    // 自動儲存
    window.addEventListener('beforeunload', () => {
        const t = tokenInput.value.trim();
        if (t && validToken(t)) { store.token = t; localStorage.setItem(TOKEN_KEY, t); save(); }
    });
})();
</script>
</body>
</html>
