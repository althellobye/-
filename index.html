<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🍒 ₍^˶ ╸𖥦 ╸˵^₎⟆♡ · Cherry</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23fce9f0'/%3E%3Ccircle cx='38' cy='40' r='12' fill='%23e85a6f'/%3E%3Ccircle cx='62' cy='40' r='12' fill='%23e85a6f'/%3E%3Cpath d='M30 55 Q50 75 70 55' stroke='%236a8c5a' stroke-width='6' fill='none' stroke-linecap='round' /%3E%3C/svg%3E">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body {
            background: linear-gradient(145deg, #fce9f0 0%, #f0f8ff 100%);
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .app {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 248, 250, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 20px 18px 24px;
            box-shadow: 0 20px 60px rgba(180, 100, 130, 0.15), 0 4px 12px rgba(180, 100, 130, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .title-wrap {
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px dashed rgba(200, 180, 190, 0.25);
        }
        .title-wrap .cherry-icon { font-size: 2.2rem; display: block; margin-bottom: 2px; }
        .title-wrap .main-title { font-size: 1.3rem; font-weight: 600; color: #5a4a55; letter-spacing: 1px; }
        .title-wrap .sub-title { font-size: 0.7rem; color: #a08a98; font-weight: 300; letter-spacing: 4px; margin-top: 2px; }

        .token-area {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.7);
            padding: 4px 12px 4px 16px;
            border-radius: 60px;
            box-shadow: 0 2px 12px rgba(180, 100, 130, 0.06);
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .token-area input {
            flex: 1;
            min-width: 60px;
            border: none;
            padding: 10px 2px;
            font-size: 0.8rem;
            font-family: monospace;
            outline: none;
            background: transparent;
            color: #4a3a45;
        }
        .token-area input::placeholder { color: #bbaab5; font-family: system-ui; }
        .token-area .btn-use {
            background: linear-gradient(135deg, #d48a9e, #c07a8e);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(200, 120, 150, 0.25);
        }
        .token-area .btn-use:active { transform: scale(0.94); }
        .token-area .btn-sync {
            background: linear-gradient(135deg, #8ac4a0, #70b088);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(120, 180, 140, 0.25);
            white-space: nowrap;
        }
        .token-area .btn-sync:active { transform: scale(0.94); }
        .token-status {
            font-size: 0.55rem;
            padding: 2px 10px;
            border-radius: 30px;
            font-weight: 500;
            white-space: nowrap;
        }
        .token-status.ok { background: #d4edda; color: #2d6a3a; }
        .token-status.no { background: #f8d7da; color: #8a3a3a; }
        .token-status.syncing { background: #fff3cd; color: #856404; }

        .upload-area {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .upload-area .upload-btn {
            background: linear-gradient(135deg, #b8d4e8, #a0c4d8);
            color: white;
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(160, 180, 210, 0.2);
        }
        .upload-area .upload-btn:active { transform: scale(0.94); }
        .upload-area .upload-btn input { display: none; }
        .upload-area .photo-count { font-size: 0.7rem; color: #8a7a85; font-weight: 300; }

        .photo-strip {
            display: flex;
            gap: 12px;
            padding: 10px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            min-height: 160px;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgba(200, 180, 190, 0.3);
            flex-direction: column;
            transition: 0.3s;
        }
        .photo-strip .empty { color: #b0a0aa; font-size: 0.8rem; text-align: center; }
        .photo-strip .photo-item { max-width: 100%; width: 100%; border-radius: 16px; overflow: hidden; border: 2px solid rgba(255, 255, 255, 0.6); box-shadow: 0 4px 16px rgba(0,0,0,0.04); }
        .photo-strip .photo-item img { width: 100%; max-height: 280px; object-fit: contain; display: block; }

        .main-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
        .main-tabs button {
            flex: 1; padding: 10px 0; border: none; border-radius: 60px; font-weight: 600;
            font-size: 0.8rem; background: rgba(240, 235, 238, 0.5); color: #6a5a65;
            cursor: pointer; transition: 0.2s; border: 1px solid transparent;
        }
        .main-tabs button.active {
            background: linear-gradient(135deg, #d48a9e, #c07a8e);
            color: white; box-shadow: 0 4px 16px rgba(200, 120, 150, 0.25);
        }
        .main-tabs button:active { transform: scale(0.94); }

        .panel {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 14px;
            min-height: 350px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
        }

        .sub-tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
        .sub-tabs button {
            padding: 4px 14px; border: none; border-radius: 40px; font-size: 0.7rem;
            background: rgba(240, 235, 238, 0.4); color: #6a5a65; cursor: pointer;
            border: 1px solid transparent; transition: 0.15s;
        }
        .sub-tabs button.active { background: rgba(200, 120, 150, 0.15); color: #8a5a6a; border-color: rgba(200, 120, 150, 0.2); }

        .btn {
            padding: 6px 18px; border: none; border-radius: 60px; font-weight: 500;
            font-size: 0.75rem; cursor: pointer; transition: 0.15s; color: white;
            background: linear-gradient(135deg, #b8d4e8, #a0c4d8);
            box-shadow: 0 4px 12px rgba(160, 180, 210, 0.15);
        }
        .btn:active { transform: scale(0.94); }
        .btn-danger { background: linear-gradient(135deg, #d48a8a, #c07a7a); box-shadow: 0 4px 12px rgba(200, 120, 120, 0.2); }
        .btn-success { background: linear-gradient(135deg, #8ac4a0, #70b088); box-shadow: 0 4px 12px rgba(120, 180, 140, 0.2); }
        .btn-sm { padding: 3px 12px; font-size: 0.65rem; }

        .flex-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0; }
        .record-card {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            padding: 8px 12px;
            margin: 4px 0;
            box-shadow: 0 1px 8px rgba(180, 160, 170, 0.06);
            font-size: 0.82rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .record-card .right { float: right; margin-left: 4px; }

        input, select, textarea {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(200, 180, 190, 0.2);
            border-radius: 30px;
            padding: 8px 14px;
            font-size: 0.82rem;
            width: 100%;
            outline: none;
            transition: 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: rgba(200, 120, 150, 0.3); box-shadow: 0 0 0 3px rgba(200, 120, 150, 0.05); }
        textarea { border-radius: 16px; min-height: 50px; resize: vertical; }

        .cal-nav { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 8px 0; }
        .cal-nav .month-label { font-size: 0.95rem; font-weight: 600; color: #5a4a55; }
        .cal-nav button { background: rgba(240, 235, 238, 0.4); border: none; font-size: 1.1rem; cursor: pointer; padding: 2px 14px; border-radius: 30px; transition: 0.15s; }
        .cal-nav button:active { transform: scale(0.9); }

        .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; margin: 4px 0; }
        .cal-grid .wk { font-weight: 600; color: #8a7a85; font-size: 0.6rem; text-align: center; padding: 4px 0; }
        .cal-grid .day {
            aspect-ratio: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; border-radius: 12px; font-size: 0.7rem;
            background: rgba(245, 240, 242, 0.3); cursor: pointer; border: 1px solid transparent;
            padding: 3px 2px; min-height: 40px; text-align: center; line-height: 1.2;
            position: relative; overflow: hidden; transition: 0.15s;
        }
        .cal-grid .day .day-number { font-size: 0.8rem; font-weight: 500; }
        .cal-grid .day .event-text {
            font-size: 0.4rem; color: #c07a8e; line-height: 1.1; max-width: 100%;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            padding: 0 1px; font-weight: 600; width: 100%;
        }
        .cal-grid .day .event-text.more { color: #b0a0aa; font-size: 0.35rem; }
        .cal-grid .day.other { color: #b0a0aa; }
        .cal-grid .day.other .event-text { color: #c0b0ba; }
        .cal-grid .day:active { transform: scale(0.9); }
        .cal-grid .day.has { background: rgba(200, 120, 150, 0.1); border-color: rgba(200, 120, 150, 0.15); }

        .grade-nav { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 8px 0; flex-wrap: wrap; gap: 4px; }
        .grade-nav .semester-label { font-size: 0.85rem; font-weight: 600; color: #5a4a55; }
        .grade-nav button { background: rgba(240, 235, 238, 0.4); border: none; font-size: 1rem; cursor: pointer; padding: 0px 12px; border-radius: 30px; }
        .grade-nav button:active { transform: scale(0.9); }

        .grade-layout { display: flex; gap: 8px; flex-wrap: wrap; }
        .grade-subjects { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
        .grade-subjects button {
            padding: 2px 12px; border: 1px solid rgba(200, 180, 190, 0.2);
            border-radius: 30px; background: rgba(255,255,255,0.4); font-size: 0.65rem;
            cursor: pointer; transition: 0.15s;
        }
        .grade-subjects button.active { background: rgba(200, 120, 150, 0.15); border-color: rgba(200, 120, 150, 0.2); }
        .grade-records { max-height: 200px; overflow-y: auto; margin-top: 6px; }

        .cups { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 8px 0; }
        .cup {
            width: 34px; height: 44px;
            background: rgba(220, 230, 240, 0.4);
            border-radius: 4px 4px 14px 14px;
            border: 2px solid rgba(160, 180, 210, 0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; cursor: pointer; user-select: none; transition: 0.15s;
        }
        .cup.filled { background: linear-gradient(135deg, #8ac4d8, #70b0c8); border-color: rgba(100, 160, 180, 0.3); color: white; }
        .cup:active { transform: scale(0.9); }

        .diary-photo { max-width: 100%; border-radius: 12px; margin: 4px 0; max-height: 180px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }
        .modal {
            background: rgba(255, 248, 250, 0.95); backdrop-filter: blur(20px);
            border-radius: 32px; padding: 24px 20px; max-width: 400px; width: 100%;
            max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .modal h3 { margin-bottom: 12px; color: #5a4a55; font-weight: 600; }
        .modal .field { margin: 6px 0; }
        .modal .field label { font-size: 0.75rem; color: #8a7a85; display: block; margin-bottom: 2px; font-weight: 500; }
        .modal .btn-row { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }

        .text-muted { color: #a08a98; font-size: 0.78rem; }

        .weather-options, .mood-options { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
        .weather-options button, .mood-options button {
            padding: 4px 12px; border: 2px solid rgba(200, 180, 190, 0.15);
            border-radius: 30px; background: rgba(255,255,255,0.4); font-size: 1.1rem;
            cursor: pointer; transition: 0.15s;
        }
        .weather-options button.selected, .mood-options button.selected {
            border-color: rgba(200, 120, 150, 0.3); background: rgba(200, 120, 150, 0.08);
        }
        .weather-options button:active, .mood-options button:active { transform: scale(0.92); }

        .sticker-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; pointer-events: none;
        }
        .sticker {
            background: rgba(255, 248, 250, 0.95); backdrop-filter: blur(20px);
            border-radius: 60px; padding: 30px 44px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            font-size: 2.5rem; text-align: center; animation: pop 0.4s ease;
            pointer-events: auto; border: 2px solid rgba(255,255,255,0.5);
        }
        .sticker .sub { font-size: 0.9rem; color: #6a5a65; margin-top: 4px; font-weight: 400; }
        @keyframes pop {
            0% { transform: scale(0.3); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        .sync-notice {
            font-size: 0.6rem;
            color: #a08a98;
            text-align: center;
            padding: 4px;
            margin-top: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 30px;
        }
        .week-label { font-size: 0.8rem; font-weight: 600; color: #5a4a55; margin-bottom: 6px; }
        .debug-info {
            font-size: 0.55rem;
            color: #b0a0aa;
            padding: 4px;
            text-align: center;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            margin-top: 4px;
            word-break: break-all;
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="title-wrap">
        <span class="cherry-icon">🍒</span>
        <div class="main-title">₍^˶ ╸𖥦 ╸˵^₎⟆♡</div>
        <div class="sub-title">· Cherry ·</div>
    </div>

    <!-- Token + 同步按鈕 -->
    <div class="token-area">
        <input type="password" id="tokenInput" placeholder="GitHub Token (ghp_...)" value="">
        <button class="btn-use" id="useTokenBtn">使用</button>
        <button class="btn-sync" id="syncBtn">🔄 同步</button>
        <span class="token-status no" id="tokenStatus">未設定</span>
    </div>

    <div class="upload-area">
        <label class="upload-btn" id="uploadBtn">
            📸 上傳照片
            <input type="file" id="photoInput" accept="image/*">
        </label>
        <span class="photo-count" id="photoCount">0 張</span>
    </div>

    <div class="photo-strip" id="photoStrip">
        <div class="empty">📸 還沒有照片 ✨</div>
    </div>

    <div class="main-tabs">
        <button class="active" data-tab="study">📚 學習</button>
        <button data-tab="diary">📖 日記</button>
        <button data-tab="health">❤️ 健康</button>
    </div>

    <div class="panel" id="panel"></div>

    <div class="sync-notice" id="syncNotice">💾 按「🔄 同步」即可在其他裝置讀取</div>
    <div class="debug-info" id="debugInfo"></div>
</div>

<script>
(function() {
    const STORE_KEY = 'cherry_data_local';
    const TOKEN_KEY = 'cherry_token_local';
    const GIST_ID_KEY = 'cherry_gist_id_manual';

    function encode(s) { return btoa(encodeURIComponent(s)); }
    function decode(s) { try { return decodeURIComponent(atob(s)); } catch(e) { return null; } }

    function saveLocal() {
        try { localStorage.setItem(STORE_KEY, encode(JSON.stringify(store))); return true; }
        catch(e) { return false; }
    }
    function loadLocal() {
        try { const raw = localStorage.getItem(STORE_KEY); if (!raw) return null; return JSON.parse(decode(raw)); }
        catch(e) { return null; }
    }

    function validToken(t) { return /^ghp_[A-Za-z0-9]{36,40}$/.test(t); }

    const SUBJECTS = ['宗教','公民','語文','英文','數學','中國歷史','世界歷史','地理','物理','化學','生物','資訊科技','體育','音樂','藝術','其他'];
    const WEATHER_EMOJIS = { '☀️': '晴', '⛅': '多雲', '☁️': '陰', '🌧️': '雨', '❄️': '雪' };
    const MOOD_EMOJIS = { '😊': '開心', '😐': '普通', '😢': '難過', '🤩': '興奮', '😌': '平靜' };
    const STATUS_ORDER = { '過度肥胖':0, '輕度肥胖':1, '正常':2, '輕度瘦弱':3, '過度瘦弱':4 };

    function generateSemesters() { const sems = []; for (let y = 2026; y <= 2035; y++) { sems.push(`${y}/${y+1} 第一段`); sems.push(`${y}/${y+1} 第二段`); } return sems; }
    const ALL_SEMESTERS = generateSemesters();

    let store = {
        token: localStorage.getItem(TOKEN_KEY) || '',
        photos: [],
        study: { calendar: [], todos: [], grades: {} },
        diary: { entries: [] },
        health: { bmi: [], water: { today: { date: '', cups: 0 }, history: [] }, exercise: [] }
    };

    const saved = loadLocal();
    if (saved) { store = saved; }

    if (!store.study.grades) store.study.grades = {};
    if (!store.study.calendar) store.study.calendar = [];
    if (!store.study.todos) store.study.todos = [];
    if (!store.diary.entries) store.diary.entries = [];
    if (!store.health.bmi) store.health.bmi = [];
    if (!store.health.water) store.health.water = { today: { date: '', cups: 0 }, history: [] };
    if (!store.health.exercise) store.health.exercise = [];

    ALL_SEMESTERS.forEach(s => { if (!store.study.grades[s]) store.study.grades[s] = {}; });

    const tokenInput = document.getElementById('tokenInput');
    const tokenStatus = document.getElementById('tokenStatus');
    const photoStrip = document.getElementById('photoStrip');
    const photoCount = document.getElementById('photoCount');
    const panel = document.getElementById('panel');
    const syncNotice = document.getElementById('syncNotice');
    const debugInfo = document.getElementById('debugInfo');
    tokenInput.value = store.token || '';

    function setDebug(msg) { debugInfo.textContent = msg; console.log('[Debug]', msg); }

    document.getElementById('useTokenBtn').addEventListener('click', function() {
        const t = tokenInput.value.trim();
        if (!t) { alert('請輸入 Token'); return; }
        if (!validToken(t)) { alert('Token 格式錯誤'); return; }
        store.token = t;
        localStorage.setItem(TOKEN_KEY, t);
        saveLocal();
        updateTokenStatus();
        alert('✅ Token 已設定！');
        renderMain();
    });

    function updateTokenStatus() {
        const t = tokenInput.value.trim();
        if (!t) { tokenStatus.textContent = '未設定'; tokenStatus.className = 'token-status no'; }
        else if (validToken(t)) { tokenStatus.textContent = '✅ 有效'; tokenStatus.className = 'token-status ok'; }
        else { tokenStatus.textContent = '⚠️ 格式錯誤'; tokenStatus.className = 'token-status no'; }
    }
    updateTokenStatus();

    // ========== 同步（上傳 + 下載） ==========
    async function fullSync() {
        const token = tokenInput.value.trim();
        if (!validToken(token)) {
            alert('請先設定有效的 Token');
            return;
        }

        tokenStatus.textContent = '⏳ 同步中...';
        tokenStatus.className = 'token-status syncing';
        setDebug('🔄 開始同步...');
        syncNotice.textContent = '☁️ 同步中...';

        try {
            // 1. 先上傳
            const syncData = JSON.parse(JSON.stringify(store));
            syncData.photos = [];
            const dataStr = JSON.stringify(syncData);

            let gistId = localStorage.getItem(GIST_ID_KEY);

            let url = 'https://api.github.com/gists';
            let method = 'POST';
            let body = {
                description: 'Cherry App Data',
                public: false,
                files: { 'data.json': { content: dataStr } }
            };

            if (gistId) {
                url = `https://api.github.com/gists/${gistId}`;
                method = 'PATCH';
                body = { files: { 'data.json': { content: dataStr } } };
            }

            const uploadRes = await fetch(url, {
                method: method,
                headers: {
                    'Authorization': `token ${token}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github.v3+json'
                },
                body: JSON.stringify(body)
            });

            if (!uploadRes.ok) {
                const err = await uploadRes.json();
                throw new Error('上傳失敗：' + (err.message || uploadRes.status));
            }

            const result = await uploadRes.json();
            if (!gistId) {
                localStorage.setItem(GIST_ID_KEY, result.id);
                gistId = result.id;
            }

            setDebug('✅ 上傳成功，開始下載...');

            // 2. 下載
            const downloadRes = await fetch(`https://api.github.com/gists/${gistId}`, {
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (!downloadRes.ok) {
                throw new Error('下載失敗');
            }

            const downloadResult = await downloadRes.json();
            const content = downloadResult.files['data.json']?.content;
            if (!content) throw new Error('資料格式錯誤');

            const remoteData = JSON.parse(content);
            const localPhotos = store.photos || [];

            store = remoteData;
            store.photos = localPhotos;

            if (!store.study.grades) store.study.grades = {};
            ALL_SEMESTERS.forEach(s => { if (!store.study.grades[s]) store.study.grades[s] = {}; });
            if (!store.study.calendar) store.study.calendar = [];
            if (!store.study.todos) store.study.todos = [];
            if (!store.diary.entries) store.diary.entries = [];
            if (!store.health.bmi) store.health.bmi = [];
            if (!store.health.water) store.health.water = { today: { date: '', cups: 0 }, history: [] };
            if (!store.health.exercise) store.health.exercise = [];

            saveLocal();
            renderPhotoStrip();
            renderMain();

            tokenStatus.textContent = '✅ 已同步';
            tokenStatus.className = 'token-status ok';
            syncNotice.textContent = '✅ 同步完成！資料已更新';
            setDebug('✅ 同步成功！');

            alert('✅ 同步完成！資料已上傳並下載最新版本');

        } catch(e) {
            tokenStatus.textContent = '❌ 同步失敗';
            tokenStatus.className = 'token-status no';
            syncNotice.textContent = '❌ 同步失敗：' + e.message;
            setDebug('❌ ' + e.message);
            alert('❌ 同步失敗：' + e.message);
        }
    }

    document.getElementById('syncBtn').addEventListener('click', fullSync);

    // ========== 照片 ==========
    function renderPhotoStrip() {
        const photos = store.photos || [];
        photoCount.textContent = `${photos.length} 張`;
        if (photos.length === 0) {
            photoStrip.innerHTML = `<div class="empty">📸 還沒有照片 ✨</div>`;
            updateUploadBtn();
            return;
        }
        const lastPhoto = photos[photos.length - 1];
        photoStrip.innerHTML = `<div class="photo-item"><img src="${lastPhoto.data}" onclick="window._viewPhoto('${lastPhoto.data}')"></div>`;
        updateUploadBtn();
    }

    function updateUploadBtn() {
        const btn = document.getElementById('uploadBtn');
        if (!btn) return;
        const photos = store.photos || [];
        const label = photos.length > 0 ? '🔄 更換照片' : '📸 上傳照片';
        btn.innerHTML = `${label} <input type="file" id="photoInput" accept="image/*">`;
        const input = btn.querySelector('input');
        if (input) {
            const newInput = input.cloneNode(true);
            input.parentNode.replaceChild(newInput, input);
            newInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    store.photos.push({ id: Date.now(), data: ev.target.result, date: new Date().toISOString().slice(0,10) });
                    saveLocal();
                    renderPhotoStrip();
                    renderMain();
                };
                reader.readAsDataURL(file);
                this.value = '';
            });
        }
    }

    window._viewPhoto = function(data) {
        const w = window.open('', '_blank');
        w.document.write(`<img src="${data}" style="max-width:100%;height:auto;">`);
    };
    renderPhotoStrip();

    // ========== 貼紙 ==========
    function showSticker(emoji, text) {
        const overlay = document.createElement('div');
        overlay.className = 'sticker-overlay';
        overlay.innerHTML = `<div class="sticker" onclick="this.parentElement.remove()">${emoji}<div class="sub">${text}</div></div>`;
        document.body.appendChild(overlay);
        setTimeout(() => { if (overlay.parentElement) overlay.remove(); }, 2500);
    }

    // ========== 選單 ==========
    let currentTab = 'study';
    let currentSub = 'calendar';
    let currentSemesterIdx = 0;
    let currentSubject = SUBJECTS[0];
    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth();

    document.querySelectorAll('.main-tabs button').forEach(b => {
        b.addEventListener('click', function() {
            document.querySelectorAll('.main-tabs button').forEach(x => x.classList.remove('active'));
            this.classList.add('active');
            currentTab = this.dataset.tab;
            renderMain();
        });
    });

    function switchSub(sub) { currentSub = sub; renderMain(); }
    function switchSubject(s) { currentSubject = s; renderMain(); }
    function changeMonth(delta) { calMonth += delta; if (calMonth > 11) { calMonth = 0; calYear++; } if (calMonth < 0) { calMonth = 11; calYear--; } renderMain(); }
    function changeSemester(delta) { currentSemesterIdx += delta; if (currentSemesterIdx < 0) currentSemesterIdx = 0; if (currentSemesterIdx >= ALL_SEMESTERS.length) currentSemesterIdx = ALL_SEMESTERS.length - 1; renderMain(); }

    // ========== 彈窗 ==========
    function showModal(title, fields, onSubmit) {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        let html = `<div class="modal"><h3>${title}</h3>`;
        fields.forEach(f => {
            if (f.type === 'weather') {
                html += `<div class="field"><label>${f.label}</label><div class="weather-options" id="modal_${f.key}">`;
                Object.keys(WEATHER_EMOJIS).forEach(e => { html += `<button data-value="${e}" class="${e===f.value?'selected':''}">${e}</button>`; });
                html += `</div></div>`;
            } else if (f.type === 'mood') {
                html += `<div class="field"><label>${f.label}</label><div class="mood-options" id="modal_${f.key}">`;
                Object.keys(MOOD_EMOJIS).forEach(e => { html += `<button data-value="${e}" class="${e===f.value?'selected':''}">${e}</button>`; });
                html += `</div></div>`;
            } else if (f.type === 'textarea') {
                html += `<div class="field"><label>${f.label}</label><textarea id="modal_${f.key}" placeholder="${f.placeholder||''}">${f.value||''}</textarea></div>`;
            } else if (f.type === 'select') {
                html += `<div class="field"><label>${f.label}</label><select id="modal_${f.key}">${f.options.map(o => `<option value="${o}" ${o===f.value?'selected':''}>${o}</option>`).join('')}</select></div>`;
            } else {
                html += `<div class="field"><label>${f.label}</label><input type="${f.type||'text'}" id="modal_${f.key}" placeholder="${f.placeholder||''}" value="${f.value||''}"></div>`;
            }
        });
        html += `<div class="btn-row"><button class="btn btn-danger" onclick="this.closest('.modal-overlay').remove()">取消</button><button class="btn" id="modalSubmit">確認</button></div></div>`;
        overlay.innerHTML = html;
        document.body.appendChild(overlay);

        overlay.querySelectorAll('.weather-options button, .mood-options button').forEach(b => {
            b.addEventListener('click', function() {
                this.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('selected'));
                this.classList.add('selected');
            });
        });

        document.getElementById('modalSubmit').addEventListener('click', function() {
            const result = {};
            fields.forEach(f => {
                if (f.type === 'weather') {
                    const sel = overlay.querySelector(`#modal_${f.key} .selected`);
                    result[f.key] = sel ? sel.dataset.value : '☀️';
                } else if (f.type === 'mood') {
                    const sel = overlay.querySelector(`#modal_${f.key} .selected`);
                    result[f.key] = sel ? sel.dataset.value : '😊';
                } else {
                    const el = document.getElementById(`modal_${f.key}`);
                    if (el) result[f.key] = el.value;
                }
            });
            overlay.remove();
            onSubmit(result);
        });
        overlay.addEventListener('click', function(e) { if (e.target === this) this.remove(); });
    }

    // ========== 渲染 ==========
    function renderMain() {
        if (currentTab === 'study') panel.innerHTML = renderStudy();
        else if (currentTab === 'diary') panel.innerHTML = renderDiary();
        else if (currentTab === 'health') panel.innerHTML = renderHealth();
        updateTokenStatus();
    }

    // ===== 學習 =====
    function renderStudy() {
        return `
            <div class="sub-tabs">
                <button class="${currentSub==='calendar'?'active':''}" onclick="window._switchSub('calendar')">📅 日曆</button>
                <button class="${currentSub==='todos'?'active':''}" onclick="window._switchSub('todos')">✅ 備忘錄</button>
                <button class="${currentSub==='grades'?'active':''}" onclick="window._switchSub('grades')">📊 成績</button>
            </div>
            ${currentSub === 'calendar' ? renderCalendar() : ''}
            ${currentSub === 'todos' ? renderTodos() : ''}
            ${currentSub === 'grades' ? renderGrades() : ''}
        `;
    }
    window._switchSub = switchSub;

    // ----- 日曆 -----
    function renderCalendar() {
        const y = calYear, m = calMonth;
        const first = new Date(y,m,1).getDay();
        const days = new Date(y,m+1,0).getDate();
        const today = new Date();
        const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

        const monthEvents = {};
        const allEvents = store.study.calendar || [];
        allEvents.forEach(e => {
            if (!e.date) return;
            const parts = e.date.split('-');
            if (parts.length === 3 && parseInt(parts[0]) === y && parseInt(parts[1]) === m+1) {
                const day = parseInt(parts[2]);
                if (!monthEvents[day]) monthEvents[day] = [];
                monthEvents[day].push(e);
            }
        });

        let html = `
            <div class="cal-nav">
                <button onclick="window._changeMonth(-1)">‹</button>
                <span class="month-label">${y}年 ${m+1}月</span>
                <button onclick="window._changeMonth(1)">›</button>
                <button class="btn btn-sm" onclick="window._addEvent()">➕</button>
            </div>
            <div class="cal-grid">
        `;
        ['日','一','二','三','四','五','六'].forEach(d => html += `<div class="wk">${d}</div>`);
        for (let i=0; i<first; i++) html += `<div class="day other"></div>`;
        for (let d=1; d<=days; d++) {
            const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const events = monthEvents[d] || [];
            const has = events.length > 0;
            let eventHtml = '';
            if (has) {
                const display = events.slice(0, 1);
                const subject = display[0].subject || display[0].content || '';
                eventHtml = `<span class="event-text">${subject}</span>`;
                if (events.length > 1) eventHtml += `<span class="event-text more">+${events.length-1}</span>`;
            }
            const isToday = ds === todayStr ? ' style="border-color:#c07a8e;border-width:2px;"' : '';
            html += `<div class="day ${has?'has':''}" onclick="window._showDay('${ds}')"${isToday}>
                <span class="day-number">${d}</span>
                ${eventHtml}
            </div>`;
        }
        html += `</div>`;

        const todayEvents = allEvents.filter(e => e.date === todayStr);
        if (todayEvents.length) {
            html += `<div style="font-weight:600;font-size:0.8rem;margin:6px 0 2px 0;">📌 今天</div>`;
            todayEvents.forEach(e => {
                const subject = e.subject ? `[${e.subject}] ` : '';
                html += `<div class="record-card">${subject}${e.content} <button class="btn btn-danger btn-sm right" onclick="window._delEvent('${e.date}','${e.content}','${e.subject||''}')">✕</button></div>`;
            });
        } else {
            html += `<div class="text-muted" style="padding:6px 0;">今天沒有行程 ✨</div>`;
        }
        return html;
    }

    window._changeMonth = changeMonth;

    window._addEvent = function() {
        if (!validToken(tokenInput.value.trim())) { alert('請先設定 Token'); return; }
        showModal('新增行程', [
            { key: 'date', label: '日期', type: 'date', value: new Date().toISOString().slice(0,10) },
            { key: 'subject', label: '科目 (可選填)', type: 'text', placeholder: '例如：數學' },
            { key: 'content', label: '內容', type: 'text', placeholder: '輸入行程內容' }
        ], function(result) {
            if (!result.date || !result.content) { alert('請填寫日期和內容'); return; }
            store.study.calendar.push({ date: result.date, subject: result.subject || '', content: result.content });
            saveLocal();
            renderMain();
        });
    };

    window._showDay = function(date) {
        const events = store.study.calendar.filter(e => e.date === date);
        if (!events.length) { alert('這天沒有行程'); return; }
        let msg = `📅 ${date} 行程：\n`;
        events.forEach((e, i) => { const subject = e.subject ? `[${e.subject}] ` : ''; msg += `${i+1}. ${subject}${e.content}\n`; });
        alert(msg);
    };

    window._delEvent = function(date, content, subject) {
        if (!confirm('刪除這個行程？')) return;
        const idx = store.study.calendar.findIndex(e => e.date === date && e.content === content && (e.subject||'') === (subject||''));
        if (idx > -1) { store.study.calendar.splice(idx,1); saveLocal(); renderMain(); }
    };

    // ----- 備忘錄 -----
    function renderTodos() {
        const todos = store.study.todos || [];
        let html = `<button class="btn" onclick="window._addTodo()">➕ 新增待辦</button>`;
        if (!todos.length) html += `<div class="text-muted" style="padding:8px 0;">✨ 沒有待辦事項</div>`;
        todos.forEach((t,i) => {
            html += `<div class="record-card">${t.text} <button class="btn btn-sm ${t.done?'btn-success':''} right" onclick="window._toggleTodo(${i})">${t.done?'✅ 完成':'⬜ 標記完成'}</button></div>`;
        });
        return html;
    }

    window._addTodo = function() {
        if (!validToken(tokenInput.value.trim())) { alert('請先設定 Token'); return; }
        showModal('新增待辦', [{ key: 'text', label: '待辦事項', type: 'text', placeholder: '輸入事項' }], function(result) {
            if (!result.text) { alert('請輸入內容'); return; }
            store.study.todos.push({ id: Date.now(), text: result.text, done: false });
            saveLocal();
            renderMain();
        });
    };

    window._toggleTodo = function(i) {
        store.study.todos[i].done = !store.study.todos[i].done;
        if (store.study.todos[i].done) store.study.todos.splice(i, 1);
        saveLocal();
        renderMain();
    };

    // ----- 成績 -----
    function renderGrades() {
        const sem = ALL_SEMESTERS[currentSemesterIdx] || ALL_SEMESTERS[0];
        const sub = currentSubject;

        let html = `
            <div class="grade-nav">
                <button onclick="window._changeSemester(-1)">‹</button>
                <span class="semester-label">${sem}</span>
                <button onclick="window._changeSemester(1)">›</button>
                <span style="font-size:0.55rem;color:#a08a98;">${currentSemesterIdx+1}/${ALL_SEMESTERS.length}</span>
            </div>
            <div class="grade-layout">
                <div style="flex:1;min-width:160px;">
                    <div class="grade-subjects">
                        ${SUBJECTS.map(s => `<button class="${s===sub?'active':''}" onclick="window._switchSubject('${s}')">${s}</button>`).join('')}
                    </div>
                    <button class="btn btn-sm" onclick="window._addGrade()">➕ 新增成績</button>
                    <div class="grade-records">
                        ${renderGradeRecords(sem, sub)}
                    </div>
                </div>
            </div>
        `;
        return html;
    }

    function renderGradeRecords(sem, sub) {
        const records = (store.study.grades[sem] || {})[sub] || [];
        if (!records.length) return `<div class="text-muted" style="padding:8px 0;">📝 尚無成績</div>`;
        let html = '';
        records.forEach((r,i) => {
            html += `<div class="record-card">${r.date} ${r.score}分 ${r.note?'('+r.note+')':''} <button class="btn btn-danger btn-sm right" onclick="window._delGrade('${sem}','${sub}',${i})">✕</button></div>`;
        });
        return html;
    }

    window._changeSemester = changeSemester;
    window._switchSubject = switchSubject;

    window._addGrade = function() {
        if (!validToken(tokenInput.value.trim())) { alert('請先設定 Token'); return; }
        const sem = ALL_SEMESTERS[currentSemesterIdx];
        const sub = currentSubject;
        showModal('新增成績', [
            { key: 'date', label: '日期', type: 'date', value: new Date().toISOString().slice(0,10) },
            { key: 'score', label: '分數', type: 'number', placeholder: '輸入分數' },
            { key: 'note', label: '補充 (可空白)', type: 'text', placeholder: '備註' }
        ], function(result) {
            if (!result.date || !result.score) { alert('請填寫日期和分數'); return; }
            const score = parseFloat(result.score);
            if (isNaN(score)) { alert('請輸入有效分數'); return; }
            if (!store.study.grades[sem]) store.study.grades[sem] = {};
            if (!store.study.grades[sem][sub]) store.study.grades[sem][sub] = [];
            const records = store.study.grades[sem][sub];
            const prev = records.length > 0 ? records[records.length-1].score : null;
            records.push({ date: result.date, score, note: result.note || '' });
            saveLocal();
            renderMain();
            if (prev !== null) {
                if (score > prev) showSticker('🎉', '進步了！繼續加油！');
                else if (score < prev) showSticker('💪', '退步了，下次加油！');
                else showSticker('😊', '保持水準！');
            } else {
                showSticker('🌟', '第一筆成績！繼續努力！');
            }
        });
    };

    window._delGrade = function(sem, sub, idx) {
        if (!confirm('刪除這筆成績？')) return;
        if (store.study.grades[sem]?.[sub]) {
            store.study.grades[sem][sub].splice(idx, 1);
            if (!store.study.grades[sem][sub].length) delete store.study.grades[sem][sub];
            saveLocal();
            renderMain();
        }
    };

    // ===== 日記 =====
    function renderDiary() {
        const entries = store.diary.entries || [];
        const today = new Date();
        const sevenDaysAgo = new Date(today);
        sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
        const sevenDaysAgoStr = sevenDaysAgo.toISOString().slice(0,10);

        const recentEntries = entries.filter(e => e.date >= sevenDaysAgoStr).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 7);

        let html = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <span class="week-label">📖 最近7天日記</span>
                <button class="btn btn-sm" onclick="window._addDiary()">➕ 新增</button>
            </div>
            <div class="flex-row">
                <input type="date" id="diarySearch" style="flex:1;">
                <button class="btn btn-sm" onclick="window._searchDiary()">🔍 搜尋</button>
            </div>
            <div style="max-height:320px;overflow-y:auto;">
                ${recentEntries.length === 0 ? '<div class="text-muted" style="padding:8px 0;">📖 最近7天沒有日記</div>' : ''}
                ${recentEntries.map(e => `
                    <div class="record-card">
                        <div><strong>${e.date||''}</strong> ${e.weather||''} ${e.mood||''}</div>
                        <div>${e.content||''}</div>
                        ${e.image ? `<img src="${e.image}" class="diary-photo">` : ''}
                        <button class="btn btn-sm" onclick="window._editDiary(${e.id})">✏️ 編輯</button>
                        <button class="btn btn-danger btn-sm" onclick="window._delDiary(${e.id})">🗑️ 刪除</button>
                    </div>
                `).join('')}
            </div>
        `;
        return html;
    }

    window._addDiary = function() {
        if (!validToken(tokenInput.value.trim())) { alert('請先設定 Token'); return; }
        showModal('新增日記', [
            { key: 'date', label: '日期', type: 'date', value: new Date().toISOString().slice(0,10) },
            { key: 'weather', label: '天氣', type: 'weather', value: '☀️' },
            { key: 'mood', label: '心情', type: 'mood', value: '😊' },
            { key: 'content', label: '內容', type: 'textarea', placeholder: '寫下今天的事...' }
        ], function(result) {
            if (!result.content) { alert('請寫點內容'); return; }
            const photos = store.photos || [];
            const lastPhoto = photos.length > 0 ? photos[photos.length-1].data : '';
            store.diary.entries.push({
                id: Date.now(),
                date: result.date || new Date().toISOString().slice(0,10),
                weather: result.weather || '☀️',
                mood: result.mood || '😊',
                content: result.content,
                image: lastPhoto
            });
            saveLocal();
            renderMain();
        });
    };

    window._editDiary = function(id) {
        const entry = store.diary.entries.find(e => e.id === id);
        if (!entry) return;
        const pwd = prompt('🔒 請輸入密碼');
        if (pwd !== 'cherry') { alert('密碼錯誤'); return; }
        showModal('編輯日記', [
            { key: 'date', label: '日期', type: 'date', value: entry.date || '' },
            { key: 'weather', label: '天氣', type: 'weather', value: entry.weather || '☀️' },
            { key: 'mood', label: '心情', type: 'mood', value: entry.mood || '😊' },
            { key: 'content', label: '內容', type: 'textarea', value: entry.content || '' }
        ], function(result) {
            entry.date = result.date || entry.date;
            entry.weather = result.weather || entry.weather;
            entry.mood = result.mood || entry.mood;
            entry.content = result.content || entry.content;
            saveLocal();
            renderMain();
        });
    };

    window._delDiary = function(id) {
        if (!confirm('確定刪除這篇日記嗎？')) return;
        const pwd = prompt('🔒 請輸入密碼');
        if (pwd !== 'cherry') { alert('密碼錯誤'); return; }
        const idx = store.diary.entries.findIndex(e => e.id === id);
        if (idx > -1) { store.diary.entries.splice(idx, 1); saveLocal(); renderMain(); }
    };

    window._searchDiary = function() {
        const date = document.getElementById('diarySearch')?.value;
        if (!date) { alert('請選擇日期'); return; }
        const found = store.diary.entries.filter(e => e.date === date);
        if (!found.length) alert('沒有找到當天日記');
        else { alert(found.map(e => `${e.date} ${e.weather} ${e.mood}\n${e.content}`).join('\n---\n')); }
    };

    // ===== 健康 =====
    function renderHealth() {
        let html = `
            <div class="flex-row">
                <button class="btn btn-sm" onclick="window._showBMI()">🧮 健康程度</button>
                <button class="btn btn-sm" onclick="window._showWater()">💧 喝水</button>
                <button class="btn btn-sm" onclick="window._showExercise()">🏃 運動</button>
            </div>
            <div id="healthContent">${renderBMI()}</div>
        `;
        return html;
    }

    function renderBMI() {
        const records = store.health.bmi || [];
        let html = `<button class="btn btn-sm" onclick="window._addBMI()">➕ 記錄健康</button>`;
        if (!records.length) html += `<div class="text-muted" style="padding:8px 0;">📊 尚無紀錄</div>`;
        records.forEach((r,i) => {
            let encourage = '';
            if (i>0) {
                const prev = records[i-1];
                const curVal = STATUS_ORDER[r.status] || 2;
                const prevVal = STATUS_ORDER[prev.status] || 2;
                if (curVal > prevVal) encourage = '🌟進步！';
                else if (curVal < prevVal) encourage = '⚠️ 注意健康';
            }
            html += `<div class="record-card">${r.date} ${r.height}cm ${r.weight}kg BMI:${r.bmi} (${r.status}) ${encourage} <button class="btn btn-danger btn-sm right" onclick="window._delBMI(${i})">✕</button></div>`;
        });
        return html;
    }

    window._showBMI = function() { document.getElementById('healthContent').innerHTML = renderBMI(); };

    window._addBMI = function() {
        if (!validToken(tokenInput.value.trim())) { alert('請先設定 Token'); return; }
        showModal('記錄健康程度', [
            { key: 'date', label: '日期', type: 'date', value: new Date().toISOString().slice(0,10) },
            { key: 'height', label: '身高 (cm)', type: 'number', placeholder: '輸入身高' },
            { key: 'weight', label: '體重 (kg)', type: 'number', placeholder: '輸入體重' }
        ], function(result) {
            const h = parseFloat(result.height);
            const w = parseFloat(result.weight);
            if (isNaN(h) || isNaN(w)) { alert('請輸入有效數字'); return; }
            const bmi = w / ((h/100)**2);
            let status = '正常';
            if (bmi < 16) status = '過度瘦弱';
            else if (bmi < 18.5) status = '輕度瘦弱';
            else if (bmi >= 24 && bmi < 27) status = '輕度肥胖';
            else if (bmi >= 27) status = '過度肥胖';
            const records = store.health.bmi;
            const prev = records.length > 0 ? records[records.length-1].status : null;
            records.push({ date: result.date, height: h, weight: w, bmi: bmi.toFixed(1), status });
            saveLocal();
            window._showBMI();
            if (prev) {
                const prevVal = STATUS_ORDER[prev] || 2;
                const curVal = STATUS_ORDER[status] || 2;
                if (curVal > prevVal) showSticker('🎉', '往健康方向進步了！');
                else if (curVal < prevVal) showSticker('⚠️', '要更注意健康喔！');
                else showSticker('😊', '維持良好狀態！');
            } else {
                showSticker('📝', '第一筆健康紀錄！');
            }
        });
    };

    window._delBMI = function(i) {
        if (!confirm('刪除這筆紀錄？')) return;
        const pwd = prompt('🔒 請輸入密碼');
        if (pwd !== 'cherry') { alert('密碼錯誤'); return; }
        store.health.bmi.splice(i,1);
        saveLocal();
        window._showBMI();
    };

    window._showWater = function() {
        const today = new Date().toISOString().slice(0,10);
        const w = store.health.water;
        if (w.today.date !== today) { w.today = { date: today, cups: 0 }; saveLocal(); }
        let html = `<div class="cups">`;
        for (let i=0; i<8; i++) { html += `<div class="cup ${i<w.today.cups?'filled':''}" onclick="window._addCup(${i})">${i<w.today.cups?'💧':'🥤'}</div>`; }
        html += `</div><div>今日已喝 ${w.today.cups} / 8 杯</div>`;
        html += `<div class="flex-row"><button class="btn btn-sm" onclick="window._resetWater()">🔄 重置</button><button class="btn btn-sm" onclick="window._waterHistory()">📋 歷史</button></div>`;
        document.getElementById('healthContent').innerHTML = html;
    };
    window._addCup = function(idx) {
        const w = store.health.water;
        if (idx < w.today.cups) return;
        w.today.cups = Math.min(8, idx+1);
        saveLocal();
        window._showWater();
    };
    window._resetWater = function() {
        if (!confirm('重置今日喝水？')) return;
        const w = store.health.water;
        w.history.push({ date: w.today.date, cups: w.today.cups });
        w.today = { date: new Date().toISOString().slice(0,10), cups: 0 };
        saveLocal();
        window._showWater();
    };
    window._waterHistory = function() {
        const h = store.health.water.history || [];
        let msg = '📋 喝水歷史\n';
        h.forEach(x => msg += `${x.date} : ${x.cups}杯\n`);
        alert(msg);
    };

    window._showExercise = function() {
        const ex = store.health.exercise || [];
        let html = `<button class="btn btn-sm" onclick="window._addExercise()">➕ 記錄運動</button>`;
        if (!ex.length) html += `<div class="text-muted" style="padding:8px 0;">🏋️ 尚無運動記錄</div>`;
        ex.forEach((e,i) => {
            html += `<div class="record-card">🏃 ${e.date} ${e.type} ${e.duration}分鐘 ${e.note||''} <button class="btn btn-danger btn-sm right" onclick="window._delExercise(${i})">✕</button></div>`;
        });
        document.getElementById('healthContent').innerHTML = html;
    };

    window._addExercise = function() {
        if (!validToken(tokenInput.value.trim())) { alert('請先設定 Token'); return; }
        showModal('記錄運動', [
            { key: 'date', label: '日期', type: 'date', value: new Date().toISOString().slice(0,10) },
            { key: 'type', label: '運動類型', type: 'text', placeholder: '跑步/游泳/跳繩/重訓' },
            { key: 'duration', label: '分鐘數', type: 'number', placeholder: '輸入分鐘' },
            { key: 'note', label: '備註 (可空白)', type: 'text', placeholder: '備註' }
        ], function(result) {
            if (!result.type || !result.duration) { alert('請填寫完整'); return; }
            store.health.exercise.push({ date: result.date, type: result.type, duration: parseInt(result.duration)||0, note: result.note||'' });
            saveLocal();
            window._showExercise();
        });
    };
    window._delExercise = function(i) {
        if (!confirm('刪除這筆紀錄？')) return;
        store.health.exercise.splice(i,1);
        saveLocal();
        window._showExercise();
    };

    // ===== 初始化 =====
    renderMain();

    setInterval(() => {
        const today = new Date().toISOString().slice(0,10);
        if (store.health.water.today.date !== today) {
            store.health.water.history.push({ date: store.health.water.today.date, cups: store.health.water.today.cups });
            store.health.water.today = { date: today, cups: 0 };
            saveLocal();
        }
    }, 60000);

    window.addEventListener('beforeunload', () => {
        const t = tokenInput.value.trim();
        if (t && validToken(t)) { store.token = t; localStorage.setItem(TOKEN_KEY, t); saveLocal(); }
    });

    // 暴露函數
    window._switchSub = switchSub;
    window._switchSubject = switchSubject;
    window._changeMonth = changeMonth;
    window._changeSemester = changeSemester;
    window._addEvent = window._addEvent;
    window._showDay = window._showDay;
    window._delEvent = window._delEvent;
    window._addTodo = window._addTodo;
    window._toggleTodo = window._toggleTodo;
    window._addGrade = window._addGrade;
    window._delGrade = window._delGrade;
    window._addDiary = window._addDiary;
    window._editDiary = window._editDiary;
    window._delDiary = window._delDiary;
    window._searchDiary = window._searchDiary;
    window._showBMI = window._showBMI;
    window._addBMI = window._addBMI;
    window._delBMI = window._delBMI;
    window._showWater = window._showWater;
    window._addCup = window._addCup;
    window._resetWater = window._resetWater;
    window._waterHistory = window._waterHistory;
    window._showExercise = window._showExercise;
    window._addExercise = window._addExercise;
    window._delExercise = window._delExercise;
    window._viewPhoto = window._viewPhoto;

})();
</script>
</body>
</html>
